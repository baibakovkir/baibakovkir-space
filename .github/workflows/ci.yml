name: Portfolio CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  image:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: frontend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: registry
        name: Normalize image owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/portfolio:sha-${{ github.sha }}
            ghcr.io/${{ steps.registry.outputs.owner }}/portfolio:latest
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: image
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -eu
          test -n "$VM_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null
      - name: Upload deployment files
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -eu
          port="${VM_PORT:-22}"
          remote_dir="portfolio-deploy-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/id_deploy -p "$port" "$VM_USER@$VM_HOST" "mkdir -p '$remote_dir'"
          scp -i ~/.ssh/id_deploy -P "$port" compose.prod.yml ops/nginx-site.conf ops/bootstrap-host.sh ops/deploy.sh "$VM_USER@$VM_HOST:$remote_dir/"
          ssh -i ~/.ssh/id_deploy -p "$port" "$VM_USER@$VM_HOST" "sudo install -d -m 755 /opt/baibakovkir-portfolio && sudo chown '$VM_USER' /opt/baibakovkir-portfolio && cp '$remote_dir/compose.prod.yml' '$remote_dir/nginx-site.conf' '$remote_dir/bootstrap-host.sh' '$remote_dir/deploy.sh' /opt/baibakovkir-portfolio/ && chmod 750 /opt/baibakovkir-portfolio/bootstrap-host.sh /opt/baibakovkir-portfolio/deploy.sh && rm -rf '$remote_dir'"
      - name: Set up HTTPS routing
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          port="${VM_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$port" "$VM_USER@$VM_HOST" "sudo /opt/baibakovkir-portfolio/bootstrap-host.sh"
      - name: Authenticate VPS to GHCR for this deployment
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          port="${VM_PORT:-22}"
          docker_config="/tmp/portfolio-ghcr-${GITHUB_RUN_ID}"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -p "$port" "$VM_USER@$VM_HOST" "mkdir -p '$docker_config' && DOCKER_CONFIG='$docker_config' docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"
      - name: Deploy immutable image and verify domain
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          IMAGE_REPOSITORY: ${{ github.repository_owner }}/portfolio
          IMAGE_TAG: sha-${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          port="${VM_PORT:-22}"
          docker_config="/tmp/portfolio-ghcr-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/id_deploy -p "$port" "$VM_USER@$VM_HOST" "cd /opt/baibakovkir-portfolio && IMAGE_REPOSITORY='${IMAGE_REPOSITORY,,}' IMAGE_TAG='$IMAGE_TAG' DOCKER_CONFIG='$docker_config' ./deploy.sh; result=\$?; rm -rf '$docker_config'; exit \$result"

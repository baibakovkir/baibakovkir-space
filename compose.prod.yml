services:
  portfolio:
    image: ghcr.io/${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}/portfolio:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "127.0.0.1:13001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
